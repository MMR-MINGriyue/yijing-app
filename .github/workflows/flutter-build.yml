name: Build Flutter APK (yijing-transform)

on:
  push:
    branches: [main]
    paths:
      - 'yijing-flutter/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:
  # tag 触发走 flutter-release.yml (workflow_call) — tag push 事件配 paths 过滤器
  # 会因评估不到变更文件被跳过, 曾致 v1.30+ 从不出 Release (iter42 修)
  workflow_call:

permissions:
  contents: write

jobs:
  flutter-apk:
    runs-on: ubuntu-latest
    env:
      # 干支历/节气/起运均以北京时间为基准; runner 默认 UTC 会导致本地时间偏移 8h
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: yijing-flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # lint 不阻塞 (engine 正确性由 verify_engine + flutter test 单独验证)
        run: flutter analyze 2>&1 | tail -200 || true

      - name: Run engine verification
        run: dart run tool/verify_engine.dart

      - name: Run Flutter tests
        # pipefail: 测试失败必须让 step 失败 (纯管道会吞退出码, iter33 修复)
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tail -60

      - name: Use official Gradle distribution on CI
        # 本地 wrapper 用腾讯镜像 (国内快); CI 在美国, 中国 CDN 间歇超时会挂 Build 步骤 (iter42 修)
        run: sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Right-size Gradle memory for CI
        # gradle.properties 本地是 -Xmx8G/4G (开发机大内存); 私有仓库标准 runner 内存有限, 防超卖 (iter42)
        run: |
          sed -i 's/-Xmx8G/-Xmx3g/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1g/' android/gradle.properties
          grep jvmargs android/gradle.properties

      - name: Build release APKs (split-per-abi + obfuscate)
        # 体积优化 (iter46): debug 全 ABI 单包 ~184MB; release 分包 arm64 仅 ~18MB (-90%).
        # 混淆符号存 artifacts 供崩溃符号化, 不上 Release
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yijing-flutter-apk
          path: |
            yijing-flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            yijing-flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            yijing-flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Attach APKs to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "version:\s*\K[0-9]+\.[0-9]+\.[0-9]+\+\d+" pubspec.yaml | head -1 | sed 's/+.*//')
          TAG="v${VERSION}"
          DIR="build/app/outputs/flutter-apk"
          cp "$DIR/app-arm64-v8a-release.apk"   "yijing-flutter-${TAG}-arm64.apk"
          cp "$DIR/app-armeabi-v7a-release.apk" "yijing-flutter-${TAG}-armeabi-v7a.apk"
          cp "$DIR/app-x86_64-release.apk"      "yijing-flutter-${TAG}-x86_64.apk"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "yijing-flutter-${TAG}-arm64.apk" \
            "yijing-flutter-${TAG}-armeabi-v7a.apk" \
            "yijing-flutter-${TAG}-x86_64.apk" \
            --title "易道 (Flutter) ${TAG}" \
            --notes "按手机 CPU 下载: 绝大多数手机选 **arm64**; 老设备选 armeabi-v7a; 模拟器选 x86_64. release 签名 (debug key), 已混淆." \
            --latest

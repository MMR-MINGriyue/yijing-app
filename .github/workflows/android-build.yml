name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify www/ matches root assets
        run: |
          fail=0
          for f in index.html data.js terms.js divination.js sw.js manifest.webmanifest README.md; do
            if [ -f "$f" ] && [ -f "www/$f" ]; then
              if cmp -s "$f" "www/$f"; then
                echo "OK   $f"
              else
                echo "DIFF $f  (root vs www/)"
                fail=1
              fi
            elif [ -f "$f" ]; then
              echo "MISS www/$f"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "::error::www/ is out of sync with root assets — copy the changed files to www/ before building the APK"
            exit 1
          fi

      - name: Install deps & sync
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yijing-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Attach APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "yijing-v\K[0-9]+\.[0-9]+\.[0-9]+" www/sw.js)
          TAG="v${VERSION}"
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$APK" "yijing-${TAG}-debug.apk"
          # 同 tag 旧 release 先清理, 避免同名资产冲突
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "yijing-${TAG}-debug.apk" \
            --title "易道 ${TAG}" \
            --notes "PWA 版本 ${VERSION} 对应的 Android debug 签名包。

          - 直接下载 APK 安装 (需开启未知来源)
          - debug 签名: 覆盖安装会保留数据; 换正式签名前勿混装
          - 版本来源: www/sw.js CACHE_VERSION" \
            --latest

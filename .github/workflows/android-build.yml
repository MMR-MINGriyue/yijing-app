name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify www/ matches root assets
        run: |
          fail=0
          for f in index.html data.js divination.js sw.js manifest.webmanifest README.md; do
            if [ -f "$f" ] && [ -f "www/$f" ]; then
              if cmp -s "$f" "www/$f"; then
                echo "OK   $f"
              else
                echo "DIFF $f  (root vs www/)"
                fail=1
              fi
            elif [ -f "$f" ]; then
              echo "MISS www/$f"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "::error::www/ is out of sync with root assets — copy the changed files to www/ before building the APK"
            exit 1
          fi

      - name: Install deps & sync
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yijing-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
